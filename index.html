<!DOCTYPE html><html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My College ID Card</title>
    <link rel="stylesheet" href="style.css">
</head><body><div class="card-container">

    <div class="id-card">

        <header class="card-header">
            <img src="images1/image1.webp" class="logo" alt="College Logo">
            <p>Pragnya Degree College</p>
        </header>

        <div class="photo-wrap">
            <img src="images1/image2.webp" alt="Profile Photo" class="photo">
        </div>

    
        <main class="card-body">

            <div class="name-section">
                <h2 class="student-name">Erigijja Yogitha</h2>
                <p class="college">Pragnya Degree College</p>
            </div>

            <hr class="divider">

            <div class="details">
                <p><strong>Course:</strong> BCA</p>
                <p><strong>Birthdate:</strong> 22-11-2006</p>
            </div>

            
            <div class="id-line">
                <span class="id-label">ID No.:</span>
                <span class="id-value">1234567890</span>
            </div>

            <div class="barcode"></div>

        </main>
        <footer class="card-footer">
            <p class="footer-text">
                Issued by: Pragnya Degree College
            </p>
        </footer>
    </div>
</div>
</body>
</html>
